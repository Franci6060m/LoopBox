name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # The proprietary Discord SDK is gitignored, so CI builds without it.
        # Without android/key.properties the project signs with the debug key, which is installable.
        env:
          ZANGETSU_NO_DISCORD: "1"
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          gh release create "build-${{ github.run_number }}" app-release.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Release APK."
