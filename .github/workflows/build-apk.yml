name: Build LoopBox release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release (unsigned)
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "^e: |What went wrong|Execution failed|error:|FAILURE|Could not|not found|Unresolved" -A2 build.log | head -40) | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle failed::$msg"
            exit $rc
          fi

      - name: Sign release APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p out
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            PASS=$(openssl rand -hex 16); ALIAS="loopbox"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LoopBox"
            echo "No signing secrets set: signed with a throwaway key. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS secrets to keep one signature across builds."
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$SRC" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$KS" \
            --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" \
            --out out/loopbox-release.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify out/loopbox-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: loopbox-release-apk
          path: out/loopbox-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/loopbox-release.apk \
            --title "LoopBox build ${{ github.run_number }}" \
            --notes "Release APK for LoopBox."
